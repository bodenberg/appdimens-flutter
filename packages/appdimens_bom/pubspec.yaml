name: appdimens_bom
description: AppDimens BOM meta-package — one dependency that pins every AppDimens Flutter strategy module at a coherent version.
version: 3.2.0
homepage: https://github.com/bodenberg/appdimens
repository: https://github.com/bodenberg/appdimens-flutter
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
resolution: workspace
dependencies:
  appdimens_flutter: ^3.2.0
  appdimens_auto: ^3.2.0
  appdimens_density: ^3.2.0
  appdimens_diagonal: ^3.2.0
  appdimens_fill: ^3.2.0
  appdimens_fit: ^3.2.0
  appdimens_fluid: ^3.2.0
  appdimens_interpolated: ^3.2.0
  appdimens_logarithmic: ^3.2.0
  appdimens_percent: ^3.2.0
  appdimens_perimeter: ^3.2.0
  appdimens_power: ^3.2.0
  appdimens_resize: ^3.2.0
  appdimens_units: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

topics:
  - responsive
  - ui
