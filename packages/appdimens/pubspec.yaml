name: appdimens
description: >-
  AppDimens 3.2 — Smart and mathematically refined responsive dimensioning for
  Flutter. Scaled (sdp/hdp/wdp/ssp) plus 12+ scaling strategies, orientation
  inverters, facilitators, builders, snapshot-partitioned cache and fast-lane
  resolution. Flutter port of the AppDimens Dynamic / AppDimens KMP family.
version: 3.2.0
homepage: https://github.com/bodenberg/appdimens
repository: https://github.com/bodenberg/appdimens-flutter
issue_tracker: https://github.com/bodenberg/appdimens-flutter/issues
documentation: https://github.com/bodenberg/appdimens-flutter/tree/main/DOCUMENTATION

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

topics:
  - responsive
  - ui
  - dimensions
  - scaling
  - cross-platform

platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:

funding:
  - https://github.com/sponsors/bodenberg
