name: appdimens_workspace
description: AppDimens Flutter workspace — modular, multiplatform responsive dimensioning (port of AppDimens Dynamic / KMP).
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - packages/appdimens_flutter
  - packages/appdimens_auto
  - packages/appdimens_bom
  - packages/appdimens_density
  - packages/appdimens_diagonal
  - packages/appdimens_fill
  - packages/appdimens_fit
  - packages/appdimens_fluid
  - packages/appdimens_interpolated
  - packages/appdimens_logarithmic
  - packages/appdimens_percent
  - packages/appdimens_perimeter
  - packages/appdimens_power
  - packages/appdimens_resize
  - packages/appdimens_units
  - packages/appdimens_custom
  - apps/sample
  - apps/benchlab
