name: Workstation platforms

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: workstation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }} workstation
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            target: linux
          - platform: Windows
            os: windows-latest
            target: windows
          - platform: macOS
            os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.9
          cache: true
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Resolve package dependencies
        run: flutter pub get
      - name: Run package tests
        run: flutter test
      - name: Resolve example dependencies
        working-directory: example
        run: |
          flutter create --platforms=${{ matrix.target }} .
          flutter pub get
      - name: Build example
        working-directory: example
        run: flutter build ${{ matrix.target }} --release
