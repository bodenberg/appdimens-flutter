name: publish

on:
  push:
    tags: ["v3.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no upload)"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Analyze (whole workspace)
        run: flutter analyze

      - name: Test every package / app
        run: |
          status=0
          for dir in packages/* apps/*; do
            if [ -f "$dir/pubspec.yaml" ] && [ -d "$dir/test" ]; then
              echo "::group::test ${dir}"
              ( cd "$dir" && flutter pub get && flutter test --reporter=github ) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

      - name: Dry-run all packages
        run: |
          status=0
          for p in appdimens_flutter appdimens_auto appdimens_bom appdimens_density \
                   appdimens_diagonal appdimens_fill appdimens_fit \
                   appdimens_fluid appdimens_interpolated \
                   appdimens_logarithmic appdimens_percent appdimens_perimeter \
                   appdimens_power appdimens_resize appdimens_units; do
            echo "::group::dry-run ${p}"
            ( cd "packages/$p" && flutter pub publish --dry-run ) || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Publish core → satellites → BOM
        if: ${{ inputs.dry_run != true }}
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          set -e
          CONFIG_HOME="$HOME/.config"
          mkdir -p "$CONFIG_HOME/dart"
          echo "$PUB_CREDENTIALS" > "$CONFIG_HOME/dart/pub-credentials.json"
          for p in appdimens_flutter appdimens_percent appdimens_power \
                   appdimens_fluid appdimens_auto appdimens_logarithmic \
                   appdimens_interpolated appdimens_diagonal \
                   appdimens_perimeter appdimens_density appdimens_fill \
                   appdimens_fit appdimens_resize appdimens_units \
                   appdimens_bom; do
            ( cd "packages/$p" && dart pub publish --force )
          done
